# OpenMastiff 前端生产示例（HTTP 80 跳转 HTTPS 443，静态资源 + API 反代）
# 安装: 复制到 /etc/nginx/conf.d/ 并按环境修改变量后 nginx -s reload

upstream openmastiff_api {
    server 127.0.0.1:18000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # 与 web/certs 或正式 CA 证书路径一致
    ssl_certificate     /opt/openMastiff/web/certs/server.crt;
    ssl_certificate_key /opt/openMastiff/web/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /opt/openMastiff/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://openmastiff_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容未带 /api 前缀的 bootstrap 探测，避免 SPA 回 HTML 被当成未初始化
    location /bootstrap/ {
        proxy_pass http://openmastiff_api/bootstrap/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
